services:
  backend:
    build:
      context: ./backend
    container_name: sticky-notes-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
    container_name: sticky-notes-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
